# Text format: line number shown all the time, next stop (request stop as running text),
# arrow + destination at a stop, running final-stop text. See zakladni.yaml for the structure.
title: Linka stále – příští zastávka / šipka + cíl / konečná
interior:
  items: [next]
  seconds: 4
  time_format: "%H:%M"
  at_stop: line_dest
  message_mode: override
  line: always
  font: 3
  spacing: 1
  sequences:
    next:
      - {text: "{name}{icons}", when: not_request}
      - {text: "{name}{icons} - na znamení / request stop {icon:znameni}", when: request, run: true}
    destination: [{text: "{icon:sipka} {DESTINATION}{dest_icons}"}]
    zone: [{text: "{zone} {zone_name}"}]
    time: [{text: "{time}"}]
    message: [{text: "{message}", run: true}]
    final: [{text: "Konečná zastávka, prosíme vystupte / Final stop, please leave the vehicle.", run: true}]
    stop: [{text: "{name}{icons}"}]
    exterior: [{text: "{destination}"}]
    via: [{text: "{via_stop}", font: 11, seconds: 3}]
