# Built-in fallback display system – used only when a vehicle names no system (or a missing one); it is not
# offered in the UI. Display systems live in the working folder systemy/ (same structure):
#   interior    – single-line interior panel (BS120): general settings + sequences
#   interior_2  – two-line interior panel (optional; without it the single-line pages are used, a page with
#                 role "heading" goes to the upper row next to the line number)
#   exterior    – exterior panels: seconds + sequences exterior / exterior_side / exterior_rear / via
# Sequences: see displays_doc.txt. Interior fonts = gBUSE fonts (0 thin, 3 normal);
# exterior fonts = gBUSE0 fonts (0–3 small, 5 medium, 6–9 large, 11 tiny).
title: Výchozí (příští zastávka / čas / zóna)
interior:
  items: [next, time, zone]
  seconds: 3
  time_format: "%H:%M"
  at_stop: line_dest
  run_time: once            # running text: once = exactly one pass, min = at least `seconds`
  message_mode: cycle
  line: at_stop
  font: 3
  spacing: 1
  sequences:
    next:
      - {text: "Příští zastávka / Next stop", font: 0, role: heading}
      - {text: "{name}{icons}"}
      - {text: "zastávka na znamení / request stop", font: 0, when: request}
    destination:
      - {text: "Směr / Direction", font: 0, role: heading}
      - {text: "{destination}"}
      - {text: "Přes {via}", font: 0, when: via}
    zone:
      - {text: "Tarifní zóna / Zone", font: 0, role: heading}
      - {text: "{zone} {zone_name}"}
    time: [{text: "{time}"}]
    message: [{text: "{message}"}]
    final: [{text: "Konečná zastávka - prosíme, vystupte"}]
    stop: [{text: "{name}{icons}"}]
    # exterior panels: destination field (exterior_side / exterior_rear override it for that role)
    exterior: [{text: "{destination}"}]
    # exterior panels with a via-stop field: one page per remaining via stop ({via_stop}), in a small font
    via: [{text: "{via_stop}", font: 11, seconds: 3}]
