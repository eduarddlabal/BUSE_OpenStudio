# PID – autobusy a trolejbusy. Podle Standardů kvality PID, příloha „Odbavovací a informační zařízení ve
# vozidlech PID“ (1. 12. 2024) a její Přílohy 2 „Požadavky na vizuální a akustické informace ve vozidle“.
#   interior_2 – vnitřní dvouřádkový LED panel (min. 16×128, červený): číslo linky vlevo v horním řádku, vedle
#                uvozující text, v dolním řádku zastávka; Obrazy 1–7 s předepsanými dobami.
#   interior   – jednořádkový panel PID v autobusech nepovoluje; pro starší vozy s jednořádkem se střídají
#                stránky jako na dvouřádku: uvozující text (tenký font, 2 s) a pak zastávka / cíl / nácestné.
#   exterior   – přední: linka + cíl; boční: cíl nahoře, dole přeblikávají po 2 s „Přes zastávky:“ – příští
#                zastávka – nácestné (tenký font 1); zadní: jen linka.
title: PID – autobusy
interior:
  items: [next]
  seconds: 4
  time_format: "%H:%M"
  at_stop: stop_name
  run_time: once
  message_mode: override
  line: always
  font: 3
  spacing: 1
  sequences:
    next:
      - {text: "příští zastávka/next:", font: 0, role: heading, seconds: 2}
      - {text: "{name}{icons}", seconds: 4, when: not_request}
      - {text: "{name}{icons} ({icon:znameni})", seconds: 4, when: request}
      - {text: "směr/direction:", font: 0, role: heading, seconds: 2}
      - {text: "{destination}{dest_icons}", seconds: 4}
      - {text: "přes zastávky/via:", font: 0, role: heading, seconds: 2, when: via}
      - {text: "{via}", run: true, seconds: 15, when: via}
    stop:
      - {text: "zastávka/this stop:", font: 0, role: heading, seconds: 2}
      - {text: "{name}{icons}", seconds: 4}
      - {text: "směr/direction:", font: 0, role: heading, seconds: 2}
      - {text: "{destination}{dest_icons}", seconds: 2}
    destination:
      - {text: "směr/direction:", font: 0, role: heading, seconds: 2}
      - {text: "{destination}{dest_icons}"}
    zone: [{text: "{zone} {zone_name}"}]
    time: [{text: "{time}"}]
    message:
      - {text: "Informace/information:", font: 0, role: heading, seconds: 2}
      - {text: "{message}", run: true}
    final:
      - {text: "Konečná zastávka, prosíme vystupte.", run: true}
      - {text: "Final stop. Please leave the bus.", run: true}
interior_2:
  items: [next]
  seconds: 4
  at_stop: stop_name
  message_mode: override
  line: always
  sequences:
    # Obraz 1–3: mimo zastávku (4 s / 4 s / běžící text nácestných, nejvýš 15 s)
    next:
      - {text: "příští zastávka/next:", font: 0, role: heading}
      - {text: "{name}{icons}", seconds: 4, when: not_request}
      - {text: "{name}{icons} {icon:znameni}", seconds: 4, when: request}
      - {text: "směr/direction:", font: 0, role: heading}
      - {text: "{destination}{dest_icons}", seconds: 4}
      - {text: "přes zastávky/via:", font: 0, role: heading, when: via}
      - {text: "{via}", run: true, seconds: 15, when: via}
    # Obraz 4–5: v zastávce (4 s / 2 s)
    stop:
      - {text: "zastávka/this stop:", font: 0, role: heading}
      - {text: "{name}{icons}", seconds: 4}
      - {text: "směr/direction:", font: 0, role: heading}
      - {text: "{destination}{dest_icons}", seconds: 2}
    destination:
      - {text: "směr/direction:", font: 0, role: heading}
      - {text: "{destination}{dest_icons}"}
    # Obraz 6–7: konečná (4 s / 2 s)
    final:
      - {text: "Konečná zastávka,", role: heading}
      - {text: "prosíme vystupte.", seconds: 4}
      - {text: "Final stop.", role: heading}
      - {text: "Please leave the bus.", seconds: 2}
    message:
      - {text: "Informace/information:", font: 0, role: heading}
      - {text: "{message}", run: true}
exterior:
  seconds: 4
  sequences:
    exterior: [{text: "{destination}{ext_dest_icons}"}]
    via:
      - {text: "Přes zastávky:", font: 1, seconds: 2}
      - {text: "{next_stop}{ext_next_icons}", font: 1, seconds: 2}
      - {text: "{via_stop}{ext_via_icons}", font: 1, seconds: 2}
