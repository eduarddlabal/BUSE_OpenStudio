name: PID_BUS – fyzický jednořádek
panels:
- name: Vnitřní BS120 (fyzický)
  type: BS120
  role: interior
  profile: BS120
  output: serial
  port: ""
  address: 10
  enabled: true
- name: LCD PID
  role: interior
  output: lcd
  http_port: 8091
  host: 127.0.0.1
- name: Nový panel
  type: BS210
  role: side
  output: virtual
  variant: v2
settings:
  interior:
    items:
    - next
    seconds: 4
    time_format: "%H:%M"
    at_stop: stop_name
    message_mode: override
    line: always
    font: 3
    spacing: 1
    sequences:
      next:
      - text: "příští zastávka/next:"
        font: 0
        role: heading
        seconds: 2
      - text: '{name}{icons}'
        seconds: 4
        when: not_request
      - text: "{name}{icons} ({icon:znameni})"
        seconds: 4
        when: request
      - text: "směr/direction:"
        font: 0
        role: heading
        seconds: 2
      - text: '{destination}{dest_icons}'
        seconds: 4
      - text: "přes zastávky/via:"
        font: 0
        role: heading
        seconds: 2
        when: via
      - text: '{via}'
        seconds: 15
        run: true
        when: via
      stop:
      - text: "zastávka/this stop:"
        font: 0
        role: heading
        seconds: 2
      - text: '{name}{icons}'
        seconds: 4
      - text: "směr/direction:"
        font: 0
        role: heading
        seconds: 2
      - text: '{destination}{dest_icons}'
        seconds: 2
      destination:
      - text: "směr/direction:"
        font: 0
        role: heading
        seconds: 2
      - text: '{destination}{dest_icons}'
      exterior:
      - text: '{destination}'
      zone:
      - text: '{zone} {zone_name}'
      time:
      - text: '{time}'
      message:
      - text: '{message}'
        run: true
      final:
      - text: Konečná zastávka, prosíme vystupte.
        seconds: 4
      - text: Final stop. Please leave the bus.
        seconds: 2
  exterior:
    seconds: 4
