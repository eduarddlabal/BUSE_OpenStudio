name: DPP – vnitřní panel s linkou – fyzický jednořádek
panels:
- name: Vnitřní BS120 (fyzický)
  type: BS120
  role: interior
  profile: BS120
  output: serial
  port: ""
  address: 10
  enabled: true
settings:
  interior:
    format: dpp
    items:
    - next
    seconds: 4
    time_format: "%H:%M"
    at_stop: line_dest
    message_mode: override
    line: always
    font: 3
    spacing: 1
    sequences:
      next:
      - text: '{name}{icons}'
        when: not_request
      - text: "{name}{icons} - na znamení / request stop {icon:znameni}"
        when: request
        run: true
      destination:
      - text: "{icon:sipka} {DESTINATION}{dest_icons}"
      exterior:
      - text: '{destination}'
      zone:
      - text: '{zone} {zone_name}'
      time:
      - text: '{time}'
      message:
      - text: '{message}'
        run: true
      final:
      - text: Konečná zastávka, prosíme vystupte / Final stop, please leave the tram.
        run: true
      stop:
      - text: '{name}{icons}'
  exterior:
    font: 3
    spacing: 1
    seconds: 4
