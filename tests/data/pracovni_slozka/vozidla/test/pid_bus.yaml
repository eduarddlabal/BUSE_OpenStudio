name: PID_BUS (test v počítači)
panels:
- name: Vnitřní BS120
  type: BS120
  role: interior
  output: virtual
- name: Čelní BS210 (v1)
  type: BS210
  variant: v1
  role: front
  output: virtual
- name: Boční BS210 (v2)
  type: BS210
  variant: v2
  stop_field: bottom
  role: side
  output: virtual
- name: Zadní BS210 (v4)
  type: BS210
  variant: v4
  role: rear
  output: virtual
- name: LCD
  type: LCD
  role: interior
  output: lcd
  http_port: 8091
  host: 127.0.0.1
settings:
  interior:
    items:
    - next
    seconds: 4
    time_format: "%H:%M"
    at_stop: stop_name
    message_mode: override
    line: always
    font: 3
    spacing: 1
    sequences:
      next:
      - text: "příští zastávka/next:"
        font: 0
        role: heading
        seconds: 2
      - text: '{name}{icons}'
        seconds: 4
        when: not_request
      - text: "{name}{icons} ({icon:znameni})"
        seconds: 4
        when: request
      - text: "směr/direction:"
        font: 0
        role: heading
        seconds: 2
      - text: '{destination}{dest_icons}'
        seconds: 4
      - text: "přes zastávky/via:"
        font: 0
        role: heading
        seconds: 2
        when: via
      - text: '{via}'
        seconds: 15
        run: true
        when: via
      stop:
      - text: "zastávka/this stop:"
        font: 0
        role: heading
        seconds: 2
      - text: '{name}{icons}'
        seconds: 4
      - text: "směr/direction:"
        font: 0
        role: heading
        seconds: 2
      - text: '{destination}{dest_icons}'
        seconds: 2
      destination:
      - text: "směr/direction:"
        font: 0
        role: heading
        seconds: 2
      - text: '{destination}{dest_icons}'
      exterior:
      - text: '{destination}'
      zone:
      - text: '{zone} {zone_name}'
      time:
      - text: '{time}'
      message:
      - text: '{message}'
        run: true
      final:
      - text: Konečná zastávka, prosíme vystupte.
        seconds: 4
      - text: Final stop. Please leave the bus.
        seconds: 2
  exterior:
    seconds: 4
