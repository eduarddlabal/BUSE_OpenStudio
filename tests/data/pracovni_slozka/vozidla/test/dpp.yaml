name: DPP – vnitřní panel s linkou (test v počítači)
panels:
- name: Vnitřní BS120
  type: BS120
  role: interior
  output: virtual
- name: Čelní BS210 (v1)
  type: BS210
  variant: v1
  role: front
  output: virtual
- name: Boční BS210 (v2)
  type: BS210
  variant: v2
  stop_field: bottom
  role: side
  output: virtual
- name: Zadní BS210 (v4)
  type: BS210
  variant: v4
  role: rear
  output: virtual
- name: LCD
  type: LCD
  role: interior
  output: lcd
  http_port: 8091
  host: 127.0.0.1
settings:
  interior:
    format: dpp
    items:
    - next
    seconds: 4
    time_format: "%H:%M"
    at_stop: line_dest
    message_mode: override
    line: always
    font: 3
    spacing: 1
    sequences:
      next:
      - text: '{name}{icons}'
        when: not_request
      - text: "{name}{icons} - na znamení / request stop {icon:znameni}"
        when: request
        run: true
      destination:
      - text: "{icon:sipka} {DESTINATION}{dest_icons}"
      exterior:
      - text: '{destination}'
      zone:
      - text: '{zone} {zone_name}'
      time:
      - text: '{time}'
      message:
      - text: '{message}'
        run: true
      final:
      - text: Konečná zastávka, prosíme vystupte / Final stop, please leave the tram.
        run: true
      stop:
      - text: '{name}{icons}'
  exterior:
    font: 3
    spacing: 1
    seconds: 4
