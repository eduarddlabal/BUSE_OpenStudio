name: Testovací autobus (test v počítači)
panels:
- name: Vnitřní BS120 (náhled)
  role: interior
  profile: BS120
  output: virtual
  enabled: true
settings:
  interior:
    items:
    - next
    - time
    - zone
    seconds: 3
    time_format: "%H:%M"
    at_stop: line_dest
    message_mode: override
    font: 3
    spacing: 1
    sequences:
      next:
      - text: '{name}'
      - text: zastávka na znamení
        font: 0
        when: request
      destination:
      - text: '{destination}'
      exterior:
      - text: '{destination}'
      zone:
      - text: "Zóna: {zone}"
      time:
      - text: "Čas: {time}"
      message:
      - text: '{message}'
      final:
      - text: Konečná zastávka - prosíme, vystupte
      stop:
      - text: '{name}{icons}'
  exterior:
    font: 3
    spacing: 1
    seconds: 4
