name: Testovací autobus (test v počítači)
panels:
- name: Vnitřní BS120
  type: BS120
  role: interior
  output: virtual
- name: Čelní BS210 (v1)
  type: BS210
  variant: v1
  role: front
  output: virtual
- name: Boční BS210 (v2)
  type: BS210
  variant: v2
  stop_field: bottom
  role: side
  output: virtual
- name: Zadní BS210 (v4)
  type: BS210
  variant: v4
  role: rear
  output: virtual
- name: LCD
  type: LCD
  role: interior
  output: lcd
  http_port: 8091
  host: 127.0.0.1
settings:
  interior:
    items:
    - next
    - time
    - zone
    seconds: 4
    next_format: "Příští zastávka: {name}{icons}"
    request_suffix: " – na znamení"
    time_format: "%H:%M"
    zone_format: Tarifní pásmo {zone}
    at_stop: line_dest
    final_text: Konečná zastávka - prosíme, vystupte
    message_mode: cycle
    font: 3
    spacing: 1
  exterior:
    format: '{destination}'
    font: 3
    spacing: 1
